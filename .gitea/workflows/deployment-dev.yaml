name: Deploy on dev

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy on dev

    runs-on: node-minio

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          set -euo pipefail
          npm install

      - name: Build
        run: |
          set -euo pipefail
          npm run build